# Deliberately weak candidate used to demonstrate a real quality-floor rejection.
# Same dataset and split as configs/training.yaml; only the regularization
# strength changes. C=1e-4 under-fits so severely that precision, recall, and F1
# fall to 0.0 (ADR-010 records the measured evidence).
dataset:
  kind: synthetic
  seed: 42
  n_samples: 2000
  regime: baseline

split:
  seed: 42
  train_fraction: 0.6
  validation_fraction: 0.2
  test_fraction: 0.2

model:
  type: logistic_regression
  random_state: 42
  hyperparameters:
    C: 1e-4
    max_iter: 1000
    solver: lbfgs

tracking:
  uri: http://localhost:5001
  experiment_name: modelops-lab
