# ModelOps Lab local stack: PostgreSQL metadata store and the MLflow tracking
# server (ADR-003, ADR-006). Credentials are development-only defaults from
# .env.example; copy it to .env and change them if the stack is exposed.
#
#   docker compose up -d --wait
#   docker compose ps
#   open http://localhost:5001
#
# Artifacts are served by the MLflow artifact proxy, so `--tracking-uri
# http://localhost:5001` is the only client setting needed.
name: modelops-lab

services:
  postgres:
    image: postgres:16.4-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-modelops}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-modelops}
      POSTGRES_DB: ${POSTGRES_DB:-modelops}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres-init.sql:/docker-entrypoint-initdb.d/01-create-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      MODELOPS_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-modelops}:${POSTGRES_PASSWORD:-modelops}@postgres:5432/${POSTGRES_DB:-modelops}
      MODELOPS_MLFLOW_TRACKING_URI: http://mlflow:5000
      MODELOPS_EVENT_RETENTION_DAYS: ${MODELOPS_EVENT_RETENTION_DAYS:-30}
      MODELOPS_APP_PORT: "8000"
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      mlflow:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import sys, urllib.request; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).status == 200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  mlflow:
    build:
      context: .
      dockerfile: docker/mlflow.Dockerfile
    environment:
      MLFLOW_BACKEND_STORE_URI: postgresql+psycopg://${POSTGRES_USER:-modelops}:${POSTGRES_PASSWORD:-modelops}@postgres:5432/${POSTGRES_DB:-modelops}
      MLFLOW_ARTIFACTS_DESTINATION: /mlflow/artifacts
    command:
      - mlflow
      - server
      - --host
      - 0.0.0.0
      - --port
      - "5000"
      - --backend-store-uri
      - postgresql+psycopg://${POSTGRES_USER:-modelops}:${POSTGRES_PASSWORD:-modelops}@postgres:5432/${POSTGRES_DB:-modelops}
      - --artifacts-destination
      - /mlflow/artifacts
      # The api container reaches MLflow as http://mlflow:5000; MLflow's
      # DNS-rebinding middleware must allow that Host header.
      - --allowed-hosts
      - localhost,localhost:5000,localhost:5001,127.0.0.1,127.0.0.1:5000,127.0.0.1:5001,mlflow,mlflow:5000
    ports:
      - "${MLFLOW_PORT:-5001}:5000"
    volumes:
      - mlflow-artifacts:/mlflow/artifacts
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # Standard-library healthcheck: the slim image has no curl.
      test: ["CMD", "python", "-c", "import sys, urllib.request; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:5000/health', timeout=3).status == 200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

volumes:
  postgres-data:
  mlflow-artifacts:
    name: ${MLFLOW_ARTIFACT_VOLUME:-modelops-lab-mlflow-artifacts}
